
name: Build BLOX APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BLOX_ANDROID_BUILD_PROJECT.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract BLOX project
        run: |
          unzip -q BLOX_ANDROID_BUILD_PROJECT.zip
          cd BLOX_ANDROID_PROJECT
          npm install
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd BLOX_ANDROID_PROJECT/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BLOX-APK
          path: BLOX_ANDROID_PROJECT/android/app/build/outputs/apk/debug/app-debug.apk
          
